name: Quarto Publish

# Production publishing is triggered only from main.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Serialize site updates; never cancel an in-flight gh-pages publication.
concurrency:
  group: quarto-gh-pages-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build site (Nix + Pixi)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Verify dependency metadata
        run: nix develop -c python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Render the full site once
        run: nix develop -c python scripts/render-site.py

      - name: Verify rendered HTML
        run: |
          test -s _site/index.html
          for post in dbscan_bench envsetting pyenvsetting quarto_post; do
            test -s "_site/posts/$post/index.html"
          done

      - name: Upload rendered website
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site
          path: _site/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  deploy:
    name: Deploy previously rendered site
    needs: build
    # Manual runs on non-main branches must never publish to gh-pages.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download rendered website
        uses: actions/download-artifact@v4
        with:
          name: quarto-site
          path: _site/

      - name: Verify downloaded website
        run: |
          test -s _site/index.html
          test -s _site/posts/dbscan_bench/index.html

      - name: Set up Quarto for publishing only
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish to existing gh-pages branch without rendering
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
