name: Test Nix Pixi One-pass Render

on:
  push:
    branches:
      - refactor/nix-pixi-baseline
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-no-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Test Pixi MatchSpec collection and conflict detection
        run: nix develop -c python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Validate One-pass dependency resolution plan
        run: nix develop -c python scripts/render-site.py --dry-run
      - name: Render whole Quarto website in one Pixi environment (no publishing)
        run: nix develop -c python scripts/render-site.py
      - name: Verify rendered site, legacy posts and executed reticulate bridge
        run: |
          test -s _site/index.html
          for post in dbscan_bench envsetting pyenvsetting quarto_post; do
            test -s "_site/posts/$post/index.html"
          done
          test -s _site/posts/pixi-onepass-test/index.html
          grep -q 'networkx imported from R:' _site/posts/pixi-onepass-test/index.html
          grep -q 'PIXIRETICULATE_BRIDGE_PASS' _site/posts/pixi-onepass-test/index.html
      - name: Confirm freeze commit would be skipped when nothing changed
        run: |
          if [[ ! -d _freeze ]] || git diff --quiet -- _freeze/; then
            echo "No tracked freeze changes. Production would skip a commit."
          else
            echo "Tracked freeze changes detected; production would commit them."
            git diff --stat -- _freeze/
          fi

      - name: Upload integration-test HTML on success
        uses: actions/upload-artifact@v4
        with:
          name: pixi-onepass-test-html
          path: _site/posts/pixi-onepass-test/index.html
          if-no-files-found: error
          retention-days: 1
