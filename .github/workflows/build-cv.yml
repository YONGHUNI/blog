name: Build CV

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
      - '.github/workflows/build-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv-main
  cancel-in-progress: false

jobs:
  build-cv:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Compile CV with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: CV.tex
          working_directory: cv
          latexmk_use_xelatex: true
          args: "-file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Replace published CV PDF
        run: |
          test -s cv/CV.pdf
          mkdir -p about/me/data
          cp cv/CV.pdf about/me/data/CV_Yonghun_Suh.pdf

      - name: Commit updated PDF to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/me/data/CV_Yonghun_Suh.pdf
          if git diff --cached --quiet; then
            echo "Generated CV PDF is unchanged."
            exit 0
          fi
          git commit -m "docs(cv): update generated CV PDF"
          # Avoid overwriting concurrent changes on main.
          git pull --rebase origin main
          git push origin HEAD:main
