project:
  type: website
  # Render source pages, not internal developer documentation.
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "about/**/*.qmd"
    - "data/**/*.qmd"
    - "giscience/index.qmd"
    - "geoai/index.qmd"
    - "climate/index.qmd"
    - "computing/index.qmd"
    - "life/index.qmd"

website:
  title: "Yonghun's Computational Geo-Blog"
  site-url: "https://yonghuni.github.io/blog/"
  favicon: /data/_quarto/favicon/geography-icon.png
  sidebar:
    - id: blog-docs
      title: "Inside the Blog"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: about/blog/index.qmd
        - section: "How it works"
          contents:
            - text: "Architecture"
              href: about/blog/architecture.qmd
            - text: "Dependencies"
              href: about/blog/dependencies.qmd
            - text: "Freeze & Caching"
              href: about/blog/freeze.qmd
        - section: "Operations & Design"
          contents:
            - text: "Build & Deployment"
              href: about/blog/deployment.qmd
            - text: "Design & Interaction"
              href: about/blog/customization.qmd
  page-footer:
    left: "Powered by [Quarto](https://quarto.org/) <?quarto.version?>"
    right: "Made with ❤️ by [YONGHUNI](https://yonghuni.github.io/blog/about/me/)"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: "GIScience"
        href: giscience/index.qmd
      - text: "GeoAI"
        href: geoai/index.qmd
      - text: "Climate Science"
        href: climate/index.qmd
      - text: "Scientific Computing"
        href: computing/index.qmd
      - text: "Academic Life"
        href: life/index.qmd
    right:
      - text: About
        menu:
          - text: Me
            href: ./about/me/index.qmd
          - text: This Blog
            href: ./about/blog/index.qmd
        
      - text:  "{{< ai orcid >}}"
        href: https://orcid.org/0009-0003-6800-2731
        target: _blank
      - icon: github
        menu:
          - text: My Profile
            href: https://github.com/YONGHUNI
            target: _blank
          - text: Source Code
            href: https://github.com/YONGHUNI/blog
            target: _blank

#  comments: 
#    giscus: 
#      repo: YONGHUNI/blog
#      theme:
#        light: light
#        dark: cobalt
format:
  html:
    theme:
      light: cosmo #sketchy
      dark: [cosmo, ./misc/theme-dark.scss]
    css: ./misc/styles.css

# Default: Quarto reuses committed execution results for unchanged posts.
# Opt-in for externally computed results: set freeze: true in a specific
# QMD and commit its _freeze output from a CPU/GPU cluster.
execute:
  freeze: auto

filters:
  - ./misc/quarto-version.lua

#editor: visual

