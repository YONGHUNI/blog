name: Quarto Publish

# Build and publish only from main. Keep test-branch pushes non-deploying.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write  # gh-pages publishing and optional tracked freeze updates

concurrency:
  group: quarto-gh-pages-publish
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Render once and publish to gh-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Validate Pixi dependency metadata
        run: nix develop -c python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Render with Nix + Pixi (one Quarto invocation)
        run: nix develop -c python scripts/render-site.py

      - name: Verify rendered HTML
        run: |
          test -s _site/index.html
          for post in dbscan_bench envsetting pyenvsetting quarto_post; do
            test -s "_site/posts/$post/index.html"
          done

      # Nix builds the site with Quarto 1.9.37. The action defaults to a
      # newer release, whose Deno project-cache format may be incompatible.
      # Clear only Quarto's internal cache; keep _site and optional _freeze.
      - name: Reset Quarto project cache after rendering
        run: rm -rf .quarto/

      - name: Set up matching Quarto for publishing
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'

      - name: Verify publishing Quarto matches build version
        run: test "$(quarto --version)" = "1.9.37"

      - name: Publish pre-rendered site
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Save all ordinary auto-freeze outputs for subsequent clean CI runners.
      # Explicit freeze:true posts are externally managed and never auto-staged.
      - name: Commit changed automatic freeze outputs
        shell: bash
        run: |
          set -euo pipefail
          # stage the execution manifest
          git add scripts/freeze-manifest.json

          if [[ -d _freeze ]]; then
            # Force-add new files ignored by .gitignore, including widget assets.
            # Exclude whole subtrees of manually frozen (cluster) documents.
            mapfile -d '' manual < <(
              nix develop -c python - <<'PY'
          import pathlib, sys, yaml
          for p in pathlib.Path("posts").rglob("*.qmd"):
              lines = p.read_text(encoding="utf-8-sig").split("---", 2)
              if len(lines) > 2:
                  data = yaml.safe_load(lines[1]) or {}
                  if isinstance(data, dict) and (data.get("execute") or {}).get("freeze") is True:
                      sys.stdout.buffer.write(("_freeze/" + p.with_suffix("").as_posix() + "/").encode() + b"\\0")
          PY
            )
            # Stage new or changed generated freeze outputs, but preserve cluster paths.
            git add -f -A -- _freeze/
            for prefix in "${manual[@]}"; do
              git restore --staged -- "$prefix" 2>/dev/null || true
            done
          fi

          if git diff --cached --quiet -- scripts/freeze-manifest.json _freeze/; then
            echo "No freeze changes; skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[BOT] Update automatic Quarto freeze [skip ci]"
          git push origin HEAD:main
