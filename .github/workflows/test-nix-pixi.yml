name: Test Nix Pixi Environment

on:
  push:
    branches:
      - refactor/nix-pixi-baseline
    paths:
      - flake.nix
      - pixi.toml
      - .github/workflows/test-nix-pixi.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-environment:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Resolve Pixi runtime
        run: nix develop -c pixi install
      - name: Check R and native GIS libraries
        run: nix develop -c pixi run check-r
      - name: Check Python
        run: nix develop -c pixi run check-python
      - name: Upload resolved Pixi lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixi-lock-candidate
          path: pixi.lock
          if-no-files-found: ignore
