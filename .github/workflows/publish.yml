name: Quarto Publish

# Build and publish only from main. Keep test-branch pushes non-deploying.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write  # gh-pages publishing and optional tracked freeze updates

concurrency:
  group: quarto-gh-pages-publish
  cancel-in-progress: false

jobs:
  build-deploy:
    name: Render once and publish to gh-pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Validate Pixi dependency metadata
        run: nix develop -c python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Render with Nix + Pixi (one Quarto invocation)
        run: nix develop -c python scripts/render-site.py

      - name: Verify rendered HTML
        run: |
          test -s _site/index.html
          for post in dbscan_bench envsetting pyenvsetting quarto_post; do
            test -s "_site/posts/$post/index.html"
          done

      - name: Set up Quarto for publishing
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Publish pre-rendered site
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Ordinary QMDs use freeze: false. Only previously tracked freeze files
      # are eligible here; new CPU/GPU cluster results must be pushed manually
      # via git add -f, never automatically collected from the Actions runner.
      - name: Push tracked Quarto freeze changes only if they exist
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d _freeze ]]; then
            echo "No _freeze directory. Skipping freeze commit."
            exit 0
          fi

          git add -u -- _freeze/
          if git diff --cached --quiet -- _freeze/; then
            echo "No tracked _freeze changes. Skipping commit and push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[BOT] Update Quarto freeze [skip ci]" -- _freeze/
          git push origin HEAD:main
