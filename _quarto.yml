project:
  type: website
  # Render source pages, not internal developer documentation.
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "about/**/*.qmd"
    - "data/**/*.qmd"
    - "giscience/**/*.qmd"
    - "geoai/**/*.qmd"
    - "climate/**/*.qmd"
    - "computing/**/*.qmd"
    - "life/**/*.qmd"

website:
  title: "Yonghun's Computational Geo-Blog"
  site-url: "https://yonghuni.github.io/blog/"
  favicon: /data/_quarto/favicon/geography-icon.png
  sidebar:
    - id: giscience
      title: "GIScience"
      style: docked
      contents:
        - text: "Overview"
          href: giscience/index.qmd
        - text: "Spatial Analysis"
          href: giscience/spatial-analysis.qmd
        - text: "Spatial Statistics"
          href: giscience/spatial-statistics.qmd
        - text: "Cartography & Visualization"
          href: giscience/cartography.qmd
    - id: geoai
      title: "GeoAI"
      style: docked
      contents:
        - text: "Overview"
          href: geoai/index.qmd
        - text: "Remote Sensing"
          href: geoai/remote-sensing.qmd
        - text: "Geospatial ML"
          href: geoai/geospatial-ml.qmd
        - text: "Applications"
          href: geoai/applications.qmd
    - id: climate
      title: "Climate Science"
      style: docked
      contents:
        - text: "Overview"
          href: climate/index.qmd
        - text: "Weather AI"
          href: climate/weather-ai.qmd
        - text: "Climate Modeling"
          href: climate/modeling.qmd
        - text: "Climate Extremes"
          href: climate/extremes.qmd
        - text: "Data & Methods"
          href: climate/data-methods.qmd
    - id: computing
      title: "Scientific Computing"
      style: docked
      contents:
        - text: "Overview"
          href: computing/index.qmd
        - text: "Linux & Environments"
          href: computing/environments.qmd
        - text: "Infrastructure"
          href: computing/infrastructure.qmd
        - text: "HPC & Workflows"
          href: computing/hpc.qmd
    - id: life
      title: "Academic Life"
      style: docked
      contents:
        - text: "Overview"
          href: life/index.qmd
        - text: "PhD Journey"
          href: life/phd.qmd
        - text: "Conferences"
          href: life/conferences.qmd
        - text: "Reflections"
          href: life/reflections.qmd
        - text: "Personal Life"
          href: life/personal.qmd
    - id: blog-docs
      title: "Inside the Blog"
      style: docked
      collapse-level: 2
      contents:
        - text: "Overview"
          href: about/blog/index.qmd
        - section: "How it works"
          contents:
            - text: "Architecture"
              href: about/blog/architecture.qmd
            - text: "Dependencies"
              href: about/blog/dependencies.qmd
            - text: "Freeze & Caching"
              href: about/blog/freeze.qmd
        - section: "Operations & Design"
          contents:
            - text: "Build & Deployment"
              href: about/blog/deployment.qmd
            - text: "Design & Interaction"
              href: about/blog/customization.qmd
  page-footer:
    left: "Powered by [Quarto](https://quarto.org/) <?quarto.version?>"
    right: "Made with ❤️ by [YONGHUNI](https://yonghuni.github.io/blog/about/me/)"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: "GIScience"
        href: giscience/index.qmd
      - text: "GeoAI"
        href: geoai/index.qmd
      - text: "Climate Science"
        href: climate/index.qmd
      - text: "Scientific Computing"
        href: computing/index.qmd
      - text: "Academic Life"
        href: life/index.qmd
    right:
      - text: About
        menu:
          - text: Me
            href: ./about/me/index.qmd
          - text: This Blog
            href: ./about/blog/index.qmd
        
      - text:  "{{< ai orcid >}}"
        href: https://orcid.org/0009-0003-6800-2731
        target: _blank
      - icon: github
        menu:
          - text: My Profile
            href: https://github.com/YONGHUNI
            target: _blank
          - text: Source Code
            href: https://github.com/YONGHUNI/blog
            target: _blank

#  comments: 
#    giscus: 
#      repo: YONGHUNI/blog
#      theme:
#        light: light
#        dark: cobalt
format:
  html:
    theme:
      light: cosmo #sketchy
      dark: [cosmo, ./misc/theme-dark.scss]
    css: ./misc/styles.css

# Default: Quarto reuses committed execution results for unchanged posts.
# Opt-in for externally computed results: set freeze: true in a specific
# QMD and commit its _freeze output from a CPU/GPU cluster.
execute:
  freeze: auto

filters:
  - ./misc/quarto-version.lua

#editor: visual

